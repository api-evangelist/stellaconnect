aid: stellaconnect
name: Stella Connect (Medallia Agent Connect)
description: 'Stella Connect, built by StellaService and acquired by Medallia in 2020, is now Medallia
  Agent Connect — a customer service team platform that pairs real-time customer feedback with agent
  coaching, quality assurance (QA), and recognition for contact center front-line teams. The product
  still runs on stellaconnect.net, and its Agent Connect API at api.stellaconnect.net exposes a Requests
  API for triggering feedback and service recovery surveys from any CRM or helpdesk, a Data Return API
  for pulling feedback, coaching sessions, QA reviews, audits, and calibrations, and a User Management
  API for employee lifecycle operations, secured with API keys and HMAC-signed JWTs.'
