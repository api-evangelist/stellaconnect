openapi: 3.0.0
info:
  title: Agent Connect Coaching Employees API
  description: Agent Connect API
  termsOfService: https://medallia.com/about/legal/terms/api
  version: 1.0.0
servers:
- url: https://{subdomain}.api.stellaconnect.net
  variables:
    subdomain:
      description: Subdomain for the Agent Connect API
      default: subdomain
security:
- ApiKeyInHeader: []
  JwtAuth: []
tags:
- name: Employees
paths:
  /v2/employees/{id}/activate:
    parameters:
    - name: id
      in: path
      description: Email or custom ID
      required: true
      style: simple
      explode: false
      schema:
        type: string
    put:
      summary: Activate Employee
      parameters:
      - name: Authorization
        in: header
        description: Token
        required: true
        style: simple
        explode: false
        schema:
          type: string
        example: '[insert your token here]'
      - name: x-api-key
        in: header
        description: Production API Key
        required: true
        style: simple
        explode: false
        schema:
          type: string
        example: '[insert your API key here]'
      - name: Content-Type
        in: header
        required: false
        style: simple
        explode: false
        schema:
          type: string
        example: application/json
      responses:
        '200':
          description: A 200 response code indicates that the employee has been activated.
        '403':
          description: Forbidden — The request was denied due to an authentication failure.
        '404':
          description: Not Found — The employee was not found.
        '422':
          description: Unprocessable Entity — The request was well-formed but was unable to be followed due to semantic errors.
        '500':
          description: Internal Server Error — The server encountered an unexpected condition that prevented it from fulfilling the request. File a Support ticket if this error is reproducible.
      tags:
      - Employees
  /v2/employees/{id}:
    parameters:
    - name: id
      in: path
      description: Email or custom_employee_id of the employee
      required: true
      style: simple
      explode: false
      schema:
        type: string
    get:
      summary: Employee
      parameters:
      - name: Authorization
        in: header
        description: Token
        required: true
        style: simple
        explode: false
        schema:
          type: string
        example: '[insert your token here]'
      - name: x-api-key
        in: header
        description: Production API Key
        required: true
        style: simple
        explode: false
        schema:
          type: string
        example: '[insert your API key here]'
      - name: Content-Type
        in: header
        required: false
        style: simple
        explode: false
        schema:
          type: string
        example: application/json
      responses:
        '200':
          description: For a 200 response code, the response body contains an object describing the employee.
          headers:
            Content-Type:
              style: simple
              explode: false
              schema:
                type: string
              example: application/json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseBodyGetEmployee'
        '403':
          description: Forbidden — The request was denied due to an authentication failure.
        '404':
          description: Not Found — The employee was not found.
        '422':
          description: Unprocessable Entity — The request was well-formed but was unable to be followed due to semantic errors.
        '500':
          description: Internal Server Error — The server encountered an unexpected condition that prevented it from fulfilling the request. File a Support ticket if this error is reproducible.
      tags:
      - Employees
    put:
      summary: Update Employee
      parameters:
      - name: Authorization
        in: header
        description: Token
        required: true
        style: simple
        explode: false
        schema:
          type: string
        example: '[insert your token here]'
      - name: x-api-key
        in: header
        description: Production API Key
        required: true
        style: simple
        explode: false
        schema:
          type: string
        example: '[insert your API key here]'
      - name: Content-Type
        in: header
        required: false
        style: simple
        explode: false
        schema:
          type: string
        example: application/json
      requestBody:
        description: An object describing the updates to be made to the employee
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestBodyUpdateEmployee'
        required: true
      responses:
        '200':
          description: For a 200 response code, the response body contains an object describing the employee.
          headers:
            Content-Type:
              style: simple
              explode: false
              schema:
                type: string
              example: application/json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseBodyUpdateEmployee'
        '403':
          description: Forbidden — The request was denied due to an authentication failure.
        '404':
          description: Not Found — The employee was not found.
        '422':
          description: Unprocessable Entity — The request was well-formed but was unable to be followed due to semantic errors.
        '500':
          description: Internal Server Error — The server encountered an unexpected condition that prevented it from fulfilling the request. File a Support ticket if this error is reproducible.
      tags:
      - Employees
  /v2/employees:
    get:
      summary: Employees
      parameters:
      - name: external_id
        in: query
        description: (Optional) External ID of the last employee in the current paginated response. This is used to build the next page of employees.
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: number_of_employees
        in: query
        description: (Optional) Sets the amount of employees that will be returned during each request. Default = 100. Max = 500.
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: status
        in: query
        description: '(Optional) Filters the users returned based on their status. Options are: active, deactivated, pending review, confirmed, unapproved, created.'
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: employee_status
        in: query
        description: '(Optional) Filters the users returned based on their employment status. Options are: full-time, part-time, temp.'
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: team_leader_ids
        in: query
        description: (Optional) Filters the users returned based on team leader. Use the team leader's numerical ID as the value. Add multiple parameters to return employees from multiple teams.
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: reporting_groups
        in: query
        description: (Optional) Filters the users returned based on reporting group. Use the reporting group's name as the value. Add multiple parameters to return employees from multiple reporting groups.
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: roles
        in: query
        description: (Optional) Filters the users returned based on role. Use the role's name as the value. Add multiple parameters to return employees from multiple roles.
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: q
        in: query
        description: (Optional) Returns employees that partially match the specified value. This will initiate a search by the employee's name, email address, and custom employee ID.
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: Authorization
        in: header
        description: Token
        required: true
        style: simple
        explode: false
        schema:
          type: string
        example: '[insert your token here]'
      - name: x-api-key
        in: header
        description: Production API Key
        required: true
        style: simple
        explode: false
        schema:
          type: string
        example: '[insert your API key here]'
      - name: Content-Type
        in: header
        required: false
        style: simple
        explode: false
        schema:
          type: string
        example: application/json
      responses:
        '200':
          description: For a 200 response code, the response body contains an array of employees.
          headers:
            Content-Type:
              style: simple
              explode: false
              schema:
                type: string
              example: application/json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseBodyGetEmployees'
        '403':
          description: Forbidden — The request was denied due to an authentication failure.
        '500':
          description: Internal Server Error — The server encountered an unexpected condition that prevented it from fulfilling the request. File a Support ticket if this error is reproducible.
      tags:
      - Employees
    post:
      summary: Create Employee
      parameters:
      - name: Authorization
        in: header
        description: Token
        required: true
        style: simple
        explode: false
        schema:
          type: string
        example: '[insert your token here]'
      - name: x-api-key
        in: header
        description: Production API Key
        required: true
        style: simple
        explode: false
        schema:
          type: string
        example: '[insert your API key here]'
      - name: Content-Type
        in: header
        required: false
        style: simple
        explode: false
        schema:
          type: string
        example: application/json
      requestBody:
        description: An object describing the employee to be invited
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestBodyCreateEmployee'
        required: true
      responses:
        '200':
          description: For a 200 response code, the response body contains an object describing the employee.
          headers:
            Content-Type:
              style: simple
              explode: false
              schema:
                type: string
              example: application/json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseBodyCreateEmployee'
        '201':
          description: Created — A 201 response code indicates that the employee has been created.
        '403':
          description: Forbidden — The request was denied due to an authentication failure.
        '500':
          description: Internal Server Error — The server encountered an unexpected condition that prevented it from fulfilling the request. File a Support ticket if this error is reproducible.
      tags:
      - Employees
  /v2/employees/{id}/deactivate:
    parameters:
    - name: id
      in: path
      description: Email or custom_employee_id of the employee
      required: true
      style: simple
      explode: false
      schema:
        type: string
    put:
      summary: Deactivate Employee
      parameters:
      - name: Authorization
        in: header
        description: Token
        required: true
        style: simple
        explode: false
